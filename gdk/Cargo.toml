[package]
name = "storyworld-gdk"
version = "0.1.0"
edition = "2021"
description = "Storyworld, a Goose GDK app: a goose-agent state machine that builds and edits SweepWeave storyworlds with large-context or low-context local models and builds exact-graded hypergame evals, through the Storyworld MCP tools and GDK skills"
publish = false

[lib]
name = "storyworld_gdk"
path = "src/lib.rs"

[[bin]]
name = "storyworld"
path = "src/main.rs"

[dependencies]
# Goose GDK, pinned to the release the goblin GDK apps (HybridTRMLDT MCP/goose_gdk_app, DataGoblin gdk/) and BitAgent desktop/ use.
goose-agent = "=0.1.0-alpha.14"
goose-providers = "=0.1.0-alpha.14"
goose-provider-types = "=0.1.0-alpha.14"
goose-sdk-types = { version = "=0.1.0-alpha.14", default-features = false }
rmcp = { version = "3.11", default-features = false }
anyhow = "1"
async-trait = "0.1"
# goose-provider-types calls chrono::Utc::now() without enabling chrono's clock feature itself.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "fs"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
