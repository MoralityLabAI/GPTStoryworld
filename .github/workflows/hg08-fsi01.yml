name: Hypergames HG-08 independent-world FSI confirmation
on:
  pull_request:
    paths:
      - 'verifiers_envs/storyworld-hypergames-env/Hypergames/single_player/hg08_registration_v1.json'
      - 'verifiers_envs/storyworld-hypergames-env/scripts/run_hg08_cpu.py'
      - 'verifiers_envs/storyworld-hypergames-env/scripts/verify_hg08_fsi01.py'
      - 'verifiers_envs/storyworld-hypergames-env/tests/test_hg08_fsi01.py'
      - 'verifiers_envs/storyworld-hypergames-env/output/evaluation_hypergames/hg08/**'
      - '.github/workflows/hg08-fsi01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: verifiers_envs/storyworld-hypergames-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/EvalMath
          ref: 5004cab9b366a412290a83945cda76987bb3cd6c
          path: .deps/evalmath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact FSI world-paired tests
        run: |
          export EVALMATH_FSI_FILE="${{ github.workspace }}/.deps/evalmath/src/spiral_ln/evaluation_finite_sample.py"
          python -m unittest discover -s tests -p 'test_hg08_fsi01.py' -v
          python scripts/verify_hg08_fsi01.py --out /tmp/hg08_source_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: hg08-fsi01-source-audit
          path: /tmp/hg08_source_audit.json
          if-no-files-found: error
  independent-cpu-replay:
    needs: source-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verifiers_envs/storyworld-hypergames-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/EvalMath
          ref: 5004cab9b366a412290a83945cda76987bb3cd6c
          path: .deps/evalmath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install registered CPU dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run all 32 prospective independent worlds
        run: |
          export EVALMATH_FSI_FILE="${{ github.workspace }}/.deps/evalmath/src/spiral_ln/evaluation_finite_sample.py"
          PYTHONPATH=src python scripts/run_hg08_cpu.py \
            --registration Hypergames/single_player/hg08_registration_v1.json \
            --out /tmp/hg08_full
      - name: Independently compare all archived paired predictions
        run: |
          export EVALMATH_FSI_FILE="${{ github.workspace }}/.deps/evalmath/src/spiral_ln/evaluation_finite_sample.py"
          python scripts/verify_hg08_fsi01.py --replay-dir /tmp/hg08_full --out /tmp/hg08_replay_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hg08-independent-cpu-replay
          path: |
            /tmp/hg08_full/*
            /tmp/hg08_replay_audit.json
          if-no-files-found: warn
