name: storyworld-hypergames-hg07-raw-neural
on:
  push:
    paths:
      - 'verifiers_envs/storyworld-hypergames-env/src/spiral_ln/*raw*.py'
      - 'verifiers_envs/storyworld-hypergames-env/tests/test_*raw*.py'
      - 'verifiers_envs/storyworld-hypergames-env/Hypergames/single_player/HG07*'
      - 'verifiers_envs/storyworld-hypergames-env/output/evaluation_hypergames/hg07/**'
      - '.github/workflows/storyworld-hypergames-hg07.yml'
  pull_request:
    paths:
      - 'verifiers_envs/storyworld-hypergames-env/**'
      - '.github/workflows/storyworld-hypergames-hg07.yml'
  workflow_dispatch:
jobs:
  cpu-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: verifiers_envs/storyworld-hypergames-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: HG07 exact and neural-interface tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*raw*.py' -q
      - name: HG07 exact math oracle
        run: PYTHONPATH=src python scripts/verify_evaluation_hypergames_raw.py
      - name: HG07 archived seed and calibration audit
        run: PYTHONPATH=src python scripts/verify_hg07_cpu_replay.py --out output/evaluation_hypergames/hg07
