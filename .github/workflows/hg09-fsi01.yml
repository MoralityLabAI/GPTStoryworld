name: HG-09 sparse causal parity, world-level FSI-01
on:
  pull_request:
    paths:
      - 'verifiers_envs/storyworld-hypergames-env/Hypergames/single_player/hg09_registration_v1.json'
      - 'verifiers_envs/storyworld-hypergames-env/scripts/run_hg09_cpu.py'
      - 'verifiers_envs/storyworld-hypergames-env/scripts/verify_hg09_fsi01.py'
      - 'verifiers_envs/storyworld-hypergames-env/tests/hg09_source_checks.py'
      - 'verifiers_envs/storyworld-hypergames-env/output/evaluation_hypergames/hg09/**'
      - '.github/workflows/hg09-fsi01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: verifiers_envs/storyworld-hypergames-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/EvalMath
          ref: 5004cab9b366a412290a83945cda76987bb3cd6c
          path: .deps/evalmath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent packed-case FSI replay on all 64 worlds
        run: |
          export EVALMATH_FSI_FILE="${{ github.workspace }}/.deps/evalmath/src/spiral_ln/evaluation_finite_sample.py"
          python scripts/verify_hg09_fsi01.py \
            --registration Hypergames/single_player/hg09_registration_v1.json \
            --paired output/evaluation_hypergames/hg09/hg09_paired_bits.csv \
            --worlds output/evaluation_hypergames/hg09/hg09_worlds.json \
            --out /tmp/hg09_source_audit.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/hg09_source_audit.json'))
          assert (j['worlds'],j['states_per_world'])==(64,256)
          assert j['totals']['loop_task']['correct']==8240
          assert j['totals']['sparse_gf2_compiled']['correct']==16384
          assert j['H1']['verdict']=='confirmed' and j['H2']['verdict']=='confirmed'
          assert j['H1']['hoeffding_one_sided_effect_bounds'][0]>.10
          assert j['H2']['hoeffding_one_sided_effect_bounds'][0]>.50
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hg09-source-fsi01
          path: /tmp/hg09_source_audit.json
          if-no-files-found: error
  independent-cpu-replay:
    needs: source-only-audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: verifiers_envs/storyworld-hypergames-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/EvalMath
          ref: 5004cab9b366a412290a83945cda76987bb3cd6c
          path: .deps/evalmath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU neural stack
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Six independent source tests, includes unregistered smoke world
        run: |
          export EVALMATH_FSI_FILE="${{ github.workspace }}/.deps/evalmath/src/spiral_ln/evaluation_finite_sample.py"
          PYTHONPATH=src python -m unittest discover -s tests -p 'hg09_source_checks.py' -v
      - name: Refit 128 neural networks and recover support on all 64 registered worlds
        run: |
          PYTHONPATH=src python scripts/run_hg09_cpu.py \
            --registration Hypergames/single_player/hg09_registration_v1.json \
            --out /tmp/hg09_full
      - name: Compare every archived per-case bit and world-level outcome
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('output/evaluation_hypergames/hg09')
          def rows(p):
              with p.open(newline='') as f:return list(csv.DictReader(f))
          expected=rows(root/'hg09_paired_bits.csv')
          fresh=rows(Path('/tmp/hg09_full/hg09_paired_bits.csv'))
          assert expected==fresh, 'neural predictions, causal bits or world IDs diverged from frozen receipts'
          old=json.load((root/'hg09_worlds.json').open())['worlds']
          new=json.load(open('/tmp/hg09_full/hg09_worlds.json'))['worlds']
          assert len(old)==len(new)==64
          for x,y in zip(old,new):
              assert x['seed']==y['seed'] and x['goal_sha256']==y['goal_sha256']
              assert x['GF2_rank']==y['GF2_rank']==140
              assert x['target_bit']==y['target_bit']
              assert x['irrelevant_bit']==y['irrelevant_bit']
              for arm in x['arms']:
                  for field in ('cal_correct','test_correct','causal_selectivity','released','false_releases','true_utility'):
                      assert x['arms'][arm][field]==y['arms'][arm][field],(x['seed'],arm,field)
          print('PASS: 64/64 worlds, all paired predictions and readout/calibration decisions identical')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hg09-complete-independent-cpu-replay
          path: /tmp/hg09_full/*
          if-no-files-found: warn
