name: Balance of Reason storyworld checks
on:
  push:
    branches:
      - storyworld/balance-of-reason-red-mihna
    paths:
      - "storyworlds/balance_of_reason/**"
      - ".github/workflows/balance-of-reason.yml"
  pull_request:
    paths:
      - "storyworlds/balance_of_reason/**"
      - ".github/workflows/balance-of-reason.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storyworld:
    name: Source, replay, native, and reader parity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out pinned content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Report toolchain
        run: |
          node --version
          python3 --version
          node -e "if(Number(process.versions.node.split('.')[0]) < 18)process.exit(1)"
      - name: Verify committed native export matches source
        run: node storyworlds/balance_of_reason/export_sweepweave.mjs --check
      - name: Validate native Sweepweave topology
        run: python3 codex-skills/storyworld-building/scripts/sweepweave_validator.py validate storyworlds/balance_of_reason/storyworld.json
      - name: Test browser, faction agency, replay, war, and native parity
        run: node --test storyworlds/balance_of_reason/*.test.mjs
