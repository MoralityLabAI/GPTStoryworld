name: Collatz Lantern SWMD and native reader replay
on:
  pull_request:
    paths:
      - 'storyworlds/collatz_lantern/**'
      - '.github/workflows/collatz-lantern.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python storyworlds/collatz_lantern/build.py --check
      - run: python -m unittest discover -s storyworlds/collatz_lantern -p 'test_*.py' -v
      - run: node --test storyworlds/collatz_lantern/reader.test.mjs
