name: storyworld-hypergames-singleplayer
on:
  push:
    paths:
      - 'verifiers_envs/storyworld-hypergames-env/**'
      - '.github/workflows/storyworld-hypergames-singleplayer.yml'
  pull_request:
    paths:
      - 'verifiers_envs/storyworld-hypergames-env/**'
      - '.github/workflows/storyworld-hypergames-singleplayer.yml'
jobs:
  exact-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: verifiers_envs/storyworld-hypergames-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Receipt verification
        run: PYTHONPATH=src python scripts/check_local_receipts.py
      - name: Recorded Qwen trajectory replay
        run: |
          if [ -f output/evaluation_hypergames/hg03_local_dev_20261116_v1/results.json ]; then
            PYTHONPATH=src python scripts/verify_hg03_local_replay.py --check
          else
            echo "Detailed neural replay artifact retained locally pending publication approval."
          fi
      - name: Exact padding transition closure
        run: PYTHONPATH=src python -c "from spiral_ln.hypergames_qwen_analysis import geometry_checks; r=geometry_checks((101,131,167,191)); print(sum(x['reachable_states_checked'] for x in r), sum(x['legal_edges_checked'] for x in r))"

